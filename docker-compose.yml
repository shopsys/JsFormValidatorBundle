version: "3.6"

x-variables:
    common_build_args: &common_build_args
        www_data_uid: 1000
        www_data_gid: 1000

services:
    webserver:
        image: nginx:alpine
        depends_on:
            -   php-fpm
        volumes:
            - .:/var/www/html
            - ./phpdocker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        ports:
            - "8001:80"

    php-fpm:
        build:
            context: .
            dockerfile: phpdocker/php-fpm/Dockerfile
            target: development
            args:
                <<: *common_build_args
        volumes:
            - .:/var/www/html
